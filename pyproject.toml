[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aimct"
version = "0.0.1"
description = "AI Meets Control Theory — a laboratory for classical control, ML, and RL on dynamical systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
# python-control: used to cross-check from-scratch implementations. The core
# library still must not import it at runtime — keep it test-only.
xcheck = ["control>=0.10"]
ml = ["torch>=2.2", "gymnasium>=1.0", "stable-baselines3>=2.0"]  # torch: CPU wheel index in CI; sb3 = RL cross-check only
dev = ["pytest>=8.0", "control>=0.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: heavy RL / learned-model training tests (minutes). Skip with -m 'not slow'.",
]
