[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aimct"
dynamic = ["version"]
description = "AI Meets Control Theory — A rigorous, code-first bridge from classical feedback control to modern machine learning and safe reinforcement learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Zalih Thomas", email = "zalihthomas@gmail.com" }
]
keywords = [
    "control-theory",
    "reinforcement-learning",
    "optimal-control",
    "lqr",
    "mpc",
    "neural-odes",
    "sindy",
    "control-barrier-functions",
    "robotics",
    "dynamical-systems",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# python-control: used to cross-check from-scratch implementations. The core
# library still must not import it at runtime — keep it test-only.
xcheck = ["control>=0.10", "slycot>=0.6"]
ml = [
    "torch>=2.2",
    "gymnasium>=1.0",
    "stable-baselines3>=2.0",
]
viz = ["pyvista>=0.44"]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-jupyter>=0.24",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "build>=1.0",
    "twine>=5.0",
    "control>=0.10",
]

[project.scripts]
aimct = "aimct.__main__:main"

[project.urls]
Homepage = "https://github.com/zalihthomas-ui/ai-meets-control-theory"
Documentation = "https://github.com/zalihthomas-ui/ai-meets-control-theory#readme"
Repository = "https://github.com/zalihthomas-ui/ai-meets-control-theory.git"
"Bug Tracker" = "https://github.com/zalihthomas-ui/ai-meets-control-theory/issues"
Changelog = "https://github.com/zalihthomas-ui/ai-meets-control-theory/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "aimct.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aimct = ["py.typed"]                 # PEP 561 - ship inline type information

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: heavy RL / learned-model training tests (minutes). Skip with -m 'not slow'.",
]
filterwarnings = [
    # tests that build a FuncAnimation and drive frames by hand (never .save/.show)
    # trip this at GC - benign in a test, the real code paths always render.
    "ignore:Animation was deleted without rendering anything:UserWarning",
]

[tool.coverage.run]
source = ["aimct"]
branch = true
omit = ["*/aimct/__main__.py", "*/aimct/dev/__main__.py"]

[tool.coverage.report]
# The 80% floor is enforced in CI only (`--cov-fail-under=80` on the full
# suite) so ad-hoc partial `--cov` runs during development don't "fail".
# Fast-lane coverage sits ~87%, the full suite higher.
show_missing = true
skip_covered = true
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "def __repr__",
    "\\.\\.\\.",                     # ... stubs / Protocol bodies
    "except ImportError",
    "pragma: no cover",
]
