# Experiment 40 - mu analysis: structured robust stability / performance
# Companion: aimct.robust (mu, robust_stability_margin, dk_iterate),
# aimct.controllers.hinf (mixsyn), Experiment 35.
# Phase 3 Track A / Exp 40.

question: >
  Experiment 35's LQG loop has an ordinary 14 dB / 66 deg gain/phase margin and
  survives a +/-45% loop-gain error and the resonance R(s) taken one at a time.
  Does that mean it is safe? Structured mu analysis says no - and it is the only
  quantity in the sweep that says anything at all as the resonance grows.

plant:
  nominal: "G(s) = 12 / ((s+1)(s+3))"
  controller: "moderate LQG - solve_care x2, q=10 / wv=25, nominal crossover ~5 rad/s"

uncertainty:
  structure: "Delta = blkdiag(delta_r [1,'R'],  Delta_c [1,'C'])"
  delta_r: "real, |.|<=1, scaled by w_g = 0.45   (a +/-45% output-multiplicative loop-gain error)"
  Delta_c: "complex, |.|<=1, scaled by W_m(s) = R(s) - 1   (covers the mode R exactly at Delta_c = 1)"
  R: "omega_r = 15 rad/s, damping zeta_r swept 0.40 -> 0.015"
  M_Delta: >
    both enter at the plant output => M(jw) = -T(jw) [w_g W_m ; w_g W_m] is rank 1,
    so mu = max_w |T(jw)| (w_g + |W_m(jw)|) has a closed form - the aimct.robust.mu
    solver is checked against it (max relative error ~4e-16 across the sweep).

part_a:
  sweep: "zeta_r in linspace(0.40, 0.015)"
  compare_per_zeta_r:
    - "w_g ||T||_inf         (gain error alone - never reaches 1)"
    - "||W_m T||_inf          (resonance alone, small-gain - crosses 1 at zeta_r ~ 0.059)"
    - "max Re pole of G*R*K   (the nominal mode Delta_c=1 - never leaves the LHP in range)"
    - "structured mu          (delta_r + Delta_c together - crosses 1 at zeta_r ~ 0.062)"
    - "LQG nominal GM / PM on G  (dead flat: 14.0 dB / 66.5 deg every row)"

part_b:
  method: "aimct.robust.dk_iterate - constant-D (frequency-flat) D-K, K-step = mixsyn with W_T scaled by the complex-block D"
  eval_at: "zeta_r = 0.04 (plain mixsyn peak mu just above 1)"
  rounds: "2 quick / 3 full"

outputs: [table.md, table.csv, figure.png]   # committed = AIMCT_EXP_FULL=1
run: "python experiments/40_mu_analysis_rs_rp/run.py"
run_full: "AIMCT_EXP_FULL=1 python experiments/40_mu_analysis_rs_rp/run.py"

headline: >
  The aimct.robust.mu solver reproduces the analytic rank-1 mu to machine
  precision. As the resonance grows, the LQG gain/phase margins stay at
  14.0 dB / 66.5 deg, the gain-error-alone and resonance-alone checks stay below
  1, and the nominal G*R pole stays in the LHP - every classical read says
  "fine" - while the structured mu climbs from 0.65 through 1 at zeta_r ~ 0.062,
  a hair earlier than the resonance-alone small-gain boundary (0.059): the
  +/-45% gain tolerance genuinely eats margin against the mode, and only the
  structured analysis shows it. In Part (b), 2-3 constant-D D-K rounds take the
  Exp-35 H-infinity design from peak mu 1.01 (RS fail) to 0.99 (RS pass) at a
  severe zeta_r = 0.04, at no cost in the nominal ||S||_inf.
