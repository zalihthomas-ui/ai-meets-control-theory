# Experiment 12 - Shielded tabular Q-learning (pendulum)
# Companion: modules/08-ai-plus-control (safety shields / hybrid architectures)
#            experiments/11 (the raw Q-learning swing-up agent)

question: >
  A tabular Q-learning agent swings the pendulum up but its coarse grid
  limit-cycles near vertical (|theta-pi| ~ 1.4 rad, whipping through at 3-5
  rad/s - outside any +/-4 N.m LQR basin). Can a safety shield turn this
  "almost works" policy into one that provably completes and holds the
  swing-up, by delegating the endgame to a classical controller?

system:
  model: aimct.systems.Pendulum       # m=1, L=1, b=0.1, g=9.81
  torque_limit: 4.0
  dt: 0.05

base_policy:
  source: tabular Q-learning (same config as Experiment 11)
  obs: [cos theta, sin theta, omega]
  bins: [15, 15, 25]
  actions: 11
  episodes_full: 1500
  episodes_quick: 250

shield:
  controller: aimct.hybrid.ShieldedController (blend="switch")
  is_safe: "|wrap(theta - pi)| > 1.0 rad"     # True -> RL drives; else -> fallback
  fallback: energy shaping (u = -1.5 sign(omega) E) + LQR catch (Q=diag(50,2), R=0.5)
  logs: intervention_log (bool/step), intervention_rate

sim: {integrator: rk4, t_final: 15.0}

# Committed table/figure are the AIMCT_EXP_FULL=1 run (~70 s). Default run trains
# 250 episodes (~11 s) for CI's per-experiment smoke.
