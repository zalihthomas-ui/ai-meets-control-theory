# Experiment 32 - direct collocation vs shooting vs sampling (OFFLINE)
# Companion: aimct.planning.DirectCollocation (new - Hermite-Simpson),
# aimct.controllers.iLQR, aimct.controllers.SamplingMPC.
# Closes the planning arc of Experiments 24 / 25 / 26 (those raced iLQR vs CEM
# as ONLINE receding-horizon controllers; this one compares the OFFLINE
# open-loop trajectory each paradigm produces).

question: >
  Every receding-horizon controller in the repo rests on solving one
  finite-horizon optimal-control problem. Three paradigms do that: indirect /
  single shooting (iLQR - a Riccati sweep over the true rollout), sampling
  (CEM - cross-entropy over action sequences), and direct transcription
  (collocation - make the state AND input at every knot decision variables and
  enforce the discretised dynamics as equality constraints). The thing direct
  transcription can express that the other two cannot is a HARD CONSTRAINT
  instead of a penalty weight. Two offline problems test that: a hard TERMINAL
  constraint (Task A) and a hard PATH constraint (Task B).

common:
  collocation: >
    aimct.planning.DirectCollocation - Hermite-Simpson defects over N knots,
    decision vector (X[0..N-1], U[0..N-1]); x0 / x_goal as explicit linear
    equalities; boxes as variable bounds; keep-out as path_con(X,U) <= 0.
    scipy.optimize.minimize("SLSQP"), analytic HS defect Jacobian (FD dynamics
    Jacobian). The constraint is HARD.
  shooting_and_sampling: >
    iLQR (one offline solve) and SamplingMPC run open-loop over the whole
    horizon. Neither has a hard-constraint mechanism - the condition is a
    penalty (large terminal Qf, or a quartic keep-out barrier in a custom cost).
  rolled_metrics: >
    re-integrate the returned u through the TRUE dynamics with a fine RK4 - FOH
    for collocation, ZOH for iLQR / CEM - the honest "does the plan fly" check.

task_A_cartpole_terminal:
  plant: aimct.systems.CartPole
  ocp: "min integral(u^2) dt ; x(0)=[0,0,pi,0] ; x(T)=[0,0,0,0] ; |u|<=20 N ; T=2 s"
  knots: "41 full / 21 quick ; iLQR & CEM at dt=0.02, horizon 100"
  penalty: "iLQR / CEM terminal Qf = diag([400, 40, 800, 40])"
  cem: "2000 samples / 120 elite / 6 iters, 40 outer refinements (full)"

task_B_pointmass_keepout:
  plant: "planar double integrator - state [x, y, vx, vy], input [ax, ay]"
  ocp: >
    min integral(||a||^2) dt ; x(0)=(-2,0) ; x(T)=(2,0) ; |a|<=3 ; T=4 s ;
    stay outside the disk centred (0,0) radius 0.70 (on the straight-line path)
  knots: "41 full / 31 quick ; iLQR & CEM at dt=0.05, horizon 80"
  penalty: "keep-out barrier W * max(0, r^2 - d^2)^2 with W = 3e3 ; soft terminal Qf = diag([120,120,12,12])"
  cem: "3000 samples / 150 elite / 6 iters, 40 outer refinements (full)"
  warm_start: "all three from the same detour arc (a knot on the disk centre zeroes the constraint gradient)"
  headline_metric: "min disk clearance = closest approach minus radius ; negative = inside the keep-out zone"

scoring:
  effort: "integral of the running cost, trapezoidal"
  terminal_error: "||x(T) - goal|| (planned knots, and re-integrated)"
  min_clearance: "Task B - distance to the disk minus its radius (planned, and re-integrated)"
  solve_ms: "wall-clock for the single offline solve"

outputs: [table.md, table.csv, figure.png]   # committed = AIMCT_EXP_FULL=1
run: "python experiments/32_direct_collocation_vs_ilqr/run.py"
run_full: "AIMCT_EXP_FULL=1 python experiments/32_direct_collocation_vs_ilqr/run.py"

headline: >
  Only direct collocation actually meets the constraint, in both tasks, because
  for it the constraint is a constraint and not a penalty knob. Task A: planned
  terminal error 0 vs iLQR 0.25 / CEM 0.65 short of upright. Task B: collocation
  rides the keep-out boundary to +-0.003 mm and hits the goal to 1e-22, while
  both penalty methods finish ~0.1-0.3 mm INSIDE the keep-out and 0.14 short of
  the goal - the penalty weight trades the two off and no setting gives both.
  iLQR reports the lowest objective in both tasks only because it solved the
  relaxed problem. Collocation also solved fastest (0.5-0.7 s vs 1-1.4 s iLQR vs
  4.5-8.3 s CEM). Its own catch: Hermite-Simpson dynamics only hold to quadrature
  order BETWEEN knots, so a defect-perfect plan still drifts 8e-4 on a fine
  re-integration (mesh-convergent) and wants a tracking controller to fly
  open-loop. Note: the SLSQP transcription is not yet hardened for an active
  nonconvex path constraint on a badly-scaled many-state plant (a keep-out disk
  on PlanarQuadrotor makes the LSQ subproblem singular) - Task B uses the
  well-scaled point mass; variable scaling + a sparse Jacobian are the fix.
