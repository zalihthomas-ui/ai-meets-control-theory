experiment:
  id: 39
  title: "Multi-Agent Distributed Formation Tracking under Switching Graph Topologies"
  date: "2026-09-07"
  author: "AIMCT Team"
  system: "MultiAgentSystem"

team:
  n_agents: 5
  agent_type: "double_integrator"
  damping: 0.1
  formation:
    type: "polygon"
    radius: 3.0

controller:
  kp: 2.5
  kv: 1.8
  k_ref: 1.2
  kv_ref: 1.0
  k_coll: 4.0
  d_safe: 1.0
  u_bounds: [-12.0, 12.0]

leader_trajectory:
  vx: 1.0
  amp_y: 4.0
  freq_y: 0.15

simulation:
  dt: 0.05
  t_final: 40.0
  phases:
    - {t_end: 8.0, topology: "complete", desc: "Initial rapid formation acquisition (K5, lambda2=5.0)"}
    - {t_end: 18.0, topology: "cycle", desc: "Ring communication (C5, lambda2=1.38)"}
    - {t_end: 26.0, topology: "line", desc: "Degraded linear path communication (P5, lambda2=0.38)"}
    - {t_end: 32.0, topology: "disconnected", desc: "Link failure / isolated node (lambda2=0.0)"}
    - {t_end: 40.0, topology: "star", desc: "Star hub recovery (S5, lambda2=1.0)"}
