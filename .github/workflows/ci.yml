name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,xcheck,ml]"

      - name: Run test suite (with coverage)
        run: pytest -q --cov=aimct --cov-report=term-missing --cov-fail-under=80

      - name: Smoke-run experiments
        run: |
          for run in experiments/*/run.py; do
            case "$run" in
              experiments/live_*)
                # interactive sandboxes: run.py opens a blocking GUI window by
                # default (plt.show()) - headless is their real smoke test,
                # and it's already exercised by the pytest suite above too.
                echo "== $run --headless =="
                python "$run" --headless
                ;;
              *)
                echo "== $run =="
                python "$run"
                ;;
            esac
          done

      - name: Guard against stray junk files
        run: |
          # 0-byte, extension-less files at the repo root have leaked in from
          # shell redirect typos more than once ((pos, FALL_LIMIT, Xdot`, ...).
          # None should ever be committed.
          junk=$(git ls-files -- ':(top)*' | while read -r f; do
            case "$f" in */*) continue;; esac       # root only
            [ -f "$f" ] && [ ! -s "$f" ] && case "$f" in *.*) ;; *) echo "$f";; esac
          done)
          if [ -n "$junk" ]; then
            echo "::error::committed stray 0-byte root file(s):"; echo "$junk"; exit 1
          fi
