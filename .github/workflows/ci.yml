name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,xcheck,ml]"

      - name: Run test suite
        run: pytest -q

      - name: Smoke-run experiments
        run: |
          for run in experiments/*/run.py; do
            case "$run" in
              experiments/live_*)
                # interactive sandboxes: run.py opens a blocking GUI window by
                # default (plt.show()) - headless is their real smoke test,
                # and it's already exercised by the pytest suite above too.
                echo "== $run --headless =="
                python "$run" --headless
                ;;
              *)
                echo "== $run =="
                python "$run"
                ;;
            esac
          done
