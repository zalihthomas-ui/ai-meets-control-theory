name: Bug Report
description: Create a report to help us improve aimct
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please ensure you have checked existing issues and the [troubleshooting guide](https://zalihthomas-ui.github.io/ai-meets-control-theory/GETTING-STARTED/).
  - type: input
    id: version
    attributes:
      label: aimct Version
      description: What version of aimct are you using? (e.g. 1.0.0, output of `python -c "import aimct; print(aimct.__version__)"`)
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment & OS
      description: Operating system and Python version
      placeholder: "Ubuntu 22.04 / Windows 11 / macOS 14, Python 3.11.5"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproducible Example
      description: Provide a minimal, self-contained Python script to reproduce the behavior.
      render: python
      placeholder: |
        import aimct
        from aimct.systems import InvertedPendulum
        from aimct.controllers import LQR

        sys = InvertedPendulum()
        # ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Traceback / Terminal Output
      description: Paste any error traceback or console output here.
      render: shell
