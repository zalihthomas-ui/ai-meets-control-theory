site_name: "AIMCT: AI Meets Control Theory"
site_description: "Unified benchmark, classical and AI-driven control framework with 34 empirical experiments, hardware bridge, and publication-grade docs."
site_author: "Zalih Thomas"
repo_url: "https://github.com/zalihthomas/ai-meets-control-theory"
repo_name: "zalihthomas/ai-meets-control-theory"
edit_uri: "edit/main/docs/"

validation:
  omitted_files: ignore
  absolute_links: ignore
  unrecognized_links: ignore

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            show_root_heading: true
            show_source: true
            heading_level: 2
            docstring_style: google
  - mkdocs-jupyter:
      include_requirejs: true
      execute: false
      ignore: ["*.py"]

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started: GETTING-STARTED.md
  - Decision Guide: DECISION-GUIDE.md
  - Results & Benchmarks: RESULTS.md
  - Usage Guide: USAGE.md
  - Visualization: VISUALIZATION.md
  - Design Preview: DEV_PREVIEW.md
  - Experiments:
      - All 34 Experiments: experiments/index.md
  - Hardware:
      - 2-Link Arm Bridge: hardware/two-link-arm.md
  - Interactive Tour: notebooks/01_tour.ipynb
  - API Reference:
      - Overview: api/index.md
      - Systems: api/systems.md
      - Controllers: api/controllers.md
      - Planning: api/planning.md
      - Estimation: api/estimation.md
      - Trajectories: api/trajectories.md
      - System Identification: api/sysid.md
      - Machine Learning: api/ml.md
      - Reinforcement Learning: api/rl.md
      - Hybrid Control: api/hybrid.md
      - Hardware-in-the-Loop: api/hil.md
      - Visualization: api/viz.md
      - Developer Tools: api/dev.md
      - Benchmarks: api/benchmarks.md
  - Project:
      - Documentation Portal: PORTAL.md
      - Phase 2 Roadmap: roadmap.md
      - Phase 3 Roadmap: roadmap-phase3.md
      - Vision & Principles: vision.md
      - Packaging & Release: PACKAGING.md
      - Changelog: changelog.md